name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

# Allow the workflow to publish to GitHub Pages via OIDC.
permissions:
  contents: read
  pages: write
  id-token: write
  # Read access to Actions, to wait for GitHub's own Pages publisher below.
  actions: read

# Only one Pages deploy at a time; let a newer run cancel an in-progress one.
concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Configure Pages
        # Reads the site's Pages configuration (base URL). It does not change
        # the Pages source setting.
        uses: actions/configure-pages@v5

      - name: Install dependencies
        run: npm ci

      - name: Build static export
        env:
          GITHUB_PAGES: 'true'
        run: npm run build

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./out

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      # While Settings → Pages → Source is "Deploy from a branch", GitHub's
      # built-in "pages build and deployment" also runs on every push and
      # publishes the raw repository (a render of the README). Whichever
      # deploys last is what the site serves, so wait for it to finish first.
      # (GitHub doesn't emit workflow_run events for that built-in workflow,
      # so it can't be used as a trigger.) Once the source is "GitHub
      # Actions" that publisher never runs and this step returns at once.
      - name: Wait for GitHub's branch publisher to finish
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          for i in $(seq 1 36); do
            if ! pending=$(gh run list -R "$GITHUB_REPOSITORY" --workflow 'pages build and deployment' \
              --commit "$GITHUB_SHA" --json status \
              --jq '[.[] | select(.status != "completed")] | length'); then
              echo "::warning::Could not query the branch publisher's runs; deploying without waiting"
              exit 0
            fi
            if [ "${pending:-0}" = "0" ]; then
              echo "No branch publish in progress for ${GITHUB_SHA}"
              exit 0
            fi
            echo "Waiting for the branch publisher (${pending} run(s) in progress)…"
            sleep 10
          done
          echo "::warning::Branch publisher still running after 6 minutes; deploying anyway"

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

      - name: Verify the live site serves the app
        env:
          PAGE_URL: ${{ steps.deployment.outputs.page_url }}
        run: |
          for i in $(seq 1 12); do
            html=$(curl -fsSL -H 'Cache-Control: no-cache' "${PAGE_URL}?check=${GITHUB_RUN_ID}-${i}" || true)
            if grep -q '<title>777 Ritual Designer</title>' <<<"$html" \
              && grep -q '/777ritualdesigner/_next/' <<<"$html"; then
              echo "Live site is serving the app: ${PAGE_URL}"
              exit 0
            fi
            sleep 10
          done
          echo "::error::${PAGE_URL} is not serving the app after deploy"
          exit 1
